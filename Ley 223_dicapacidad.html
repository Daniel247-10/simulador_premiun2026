        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `<div class='question-text'><strong>${item.q}</strong></div>`;
            const list = document.createElement('ul');
            item.options.forEach((opt, idx) => {
                const li = document.createElement('li');
                li.innerText = opt;
                li.onclick = () => {
                    const allLi = list.querySelectorAll('li');
                    allLi.forEach(l => l.style.pointerEvents = 'none');
                    const fb = document.getElementById(`fb-${index}`);
                    fb.style.display = 'block';
                    if(idx === item.correct) {
                        li.classList.add('selected-correct');
                        fb.innerHTML = "¡Correcto! " + item.retro;
                        fb.style.background = "#d4edda";
                    } else {
                        li.classList.add('selected-incorrect');
                        fb.innerText = "¡Incorrrecto!";
                        fb.style.background = "#f8d7da";
                    }
                };
                list.appendChild(li);
            });
            card.appendChild(list);
            const fbDiv = document.createElement('div');
            fbDiv.id = `fb-${index}`; fbDiv.className = 'feedback';
            card.appendChild(fbDiv);
            container.appendChild(card);
